# Continuous integration — runs the same gate as `npm run check` on every PR
# and every push to main: tests, typecheck, lint, and a production build.
#
# Notes:
# - The build intentionally runs WITHOUT secrets: scripts/run-build.mjs is
#   designed so builds never require database access, and src/lib/config.ts
#   treats all integration env vars as optional (features degrade gracefully).
#   Database migrations are a separate, controlled release step
#   (`npm run db:migrate:deploy`), never part of CI.
# - `npm run encoding:check` is NOT included: it currently fails on many
#   pre-existing files (em dashes etc.). Add it here after a cleanup pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`, so the client exists for tests
      # and the typecheck without any database connection.
      - name: Install dependencies
        run: npm ci

      # Fails when a migration was added without regenerating the manifest,
      # which would leave /api/readyz blind to the new migration and let a
      # database that is behind the code report a false green.
      - name: Migration manifest up to date
        run: npm run migrations:check

      - name: Tests
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    name: E2E smoke (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Loads every route in a real browser and fails on 5xx / error boundaries /
    # console errors. This is the layer that catches runtime-only faults such
    # as a database behind the deployed code (Prisma P2022), which typecheck
    # and unit tests cannot see.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: estateos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/estateos_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/estateos_e2e
      # Lets the authenticated sweep mint sessions without Clerk. Safe here:
      # the database is a throwaway container, never production.
      ESTATEOS_ENABLE_DEV_BYPASS: "true"
      # NODE_ENV is deliberately NOT set here: the build below must run as a
      # normal production build, and only the test run overrides it (see
      # "Run E2E smoke suite").
      DEFAULT_COMPANY_SLUG: acme-realty
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npm run e2e:install

      # The E2E database is migrated from the same migration files production
      # uses, so a broken or missing migration fails here instead of in prod.
      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Seed demo tenant
        run: npm run db:seed
        continue-on-error: true

      # Build once, then serve that build. Running the suite against `next dev`
      # made every route compile on its first request (30s+ per admin route on
      # a runner), which exhausted the job's time budget before the sweep
      # finished. A production build serves each route in well under a second.
      - name: Build
        run: npm run build

      # NODE_ENV=test keeps the dev-session bypass available on a production
      # build (see allowDevBypass in src/lib/config.ts), so the authenticated
      # sweep still runs instead of skipping itself.
      - name: Run E2E smoke suite
        run: npm run e2e
        env:
          NODE_ENV: test
          E2E_SERVER_COMMAND: npm run start

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
